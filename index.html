  <script>
    // Run before render: if user has already seen the splash this session, skip animations entirely.
    try {
      if (sessionStorage.getItem('seen') === '1') {
        document.documentElement.classList.add('instant');
      } else {
        sessionStorage.setItem('seen', '1');
      }
    } catch (e) {}
  </script>
  <style>
    :root {
      --cream: #F5F3EC;
      --ink: #1A1A1A;
      --muted: #8A8378;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--cream);
      color: var(--ink);
      font-family: 'DM Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 48px;
      padding: 32px;
    }

    .mark {
      width: 56px;
      height: auto;
      opacity: 0;
      transform: translateY(8px);
      animation: rise 0.9s cubic-bezier(0.2, 0, 0, 1) 0.1s forwards;
    }

    .tagline {
      font-size: 13px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink);
      margin: 0;
      opacity: 0;
      animation: fade 0.7s ease-out 0.7s forwards;
    }

    .links {
      display: flex;
      gap: 56px;
      opacity: 0;
      animation: fade 0.7s ease-out 1.05s forwards;
    }

    .links a {
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: none;
      padding: 10px 2px;
      border-bottom: 1px solid transparent;
      transition: border-color 0.4s ease;
    }
    .links a:hover, .links a:focus-visible {
      border-bottom-color: var(--ink);
      outline: none;
    }

    footer {
      padding: 0 32px 32px;
      text-align: center;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      animation: fade 0.7s ease-out 1.25s forwards;
    }
    footer p { margin: 0; line-height: 1.9; }
    footer p.signature { margin-top: 1.2em; }

    @keyframes rise { to { opacity: 1; transform: translateY(0); } }
    @keyframes fade { to { opacity: 1; } }

    @media (max-width: 480px) {
      .stage { gap: 40px; padding: 24px; }
      .mark { width: 48px; }
      .links { gap: 36px; }
      footer { padding: 0 24px 24px; font-size: 9.5px; letter-spacing: 0.2em; }
    }

    @media (prefers-reduced-motion: reduce) {
      .mark, .tagline, .links, footer {
        opacity: 1;
        transform: none;
        animation: none;
      }
    }

    /* Return visits within session: skip animations entirely */
    html.instant .mark,
    html.instant .tagline,
    html.instant .links,
    html.instant footer {
      opacity: 1;
      transform: none;
      animation: none;
    }

    /* Soft crossfade between pages (Chrome, Edge, Safari 18.2+) */
    @view-transition { navigation: auto; }

    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation-duration: 0.6s;
      animation-timing-function: ease;
    }

    @media (prefers-reduced-motion: reduce) {
      @view-transition { navigation: none; }
    }

    /* Fallback for browsers without view transitions: gentle fade on return visits */
    @supports not (view-transition-name: root) {
      html.instant body { animation: fade 0.4s ease-out; }
    }
  </style>
</head>
